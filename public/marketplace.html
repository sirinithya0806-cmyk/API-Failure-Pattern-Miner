<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MarketHub</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f6f8;
            color: #222;
        }

        /* ================= HEADER ================= */

        header {
            background: #111827;
            color: white;
            padding: 18px 50px;

            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
        }

        .logo span {
            color: #38bdf8;
        }

        .header-right {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .cart-button {
            background: #38bdf8;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        /* ================= HERO ================= */

        .hero {
            background: white;
            padding: 45px 50px;
            text-align: center;
        }

        .hero h1 {
            font-size: 38px;
            margin-bottom: 10px;
        }

        .hero p {
            color: #666;
            font-size: 17px;
        }

        /* ================= SEARCH ================= */

        .search-container {
            padding: 25px 50px;
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .search-container input {
            width: 500px;
            padding: 14px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        .search-container button {
            padding: 14px 22px;
            border: none;
            border-radius: 8px;
            background: #111827;
            color: white;
            cursor: pointer;
        }

        /* ================= PRODUCTS ================= */

        .section {
            padding: 20px 50px 50px;
        }

        .section h2 {
            margin-bottom: 25px;
        }

        .products {
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(240px, 1fr));

            gap: 25px;
        }

        .product-card {
            background: white;
            border-radius: 12px;
            padding: 25px;

            box-shadow:
                0 4px 15px rgba(0,0,0,0.08);

            transition: 0.2s;
        }

        .product-card:hover {
            transform: translateY(-4px);
        }

        .product-image {
            height: 150px;
            background: #e5e7eb;
            border-radius: 10px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 55px;
            margin-bottom: 18px;
        }

        .product-card h3 {
            margin-bottom: 8px;
        }

        .category {
            color: #777;
            font-size: 14px;
            margin-bottom: 12px;
        }

        .price {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .add-button {
            width: 100%;
            padding: 11px;

            border: none;
            border-radius: 7px;

            background: #111827;
            color: white;

            cursor: pointer;
        }

        .add-button:hover {
            background: #263247;
        }

        /* ================= SEARCH RESULTS ================= */

        #searchResult {
            text-align: center;
            margin-top: 10px;
            font-weight: bold;
        }

        /* ================= CART ================= */

        .cart-section {
            background: white;
            padding: 30px 50px;
            margin-top: 20px;
        }

        .cart-section h2 {
            margin-bottom: 20px;
        }

        .cart-item {
            padding: 12px 0;
            border-bottom: 1px solid #ddd;

            display: flex;
            justify-content: space-between;
        }

        .order-button {
            margin-top: 20px;

            padding: 13px 22px;

            border: none;
            border-radius: 8px;

            background: #16a34a;
            color: white;

            cursor: pointer;
            font-weight: bold;
        }

        /* ================= STATUS ================= */

        #status {
            text-align: center;
            padding: 15px;
            font-weight: bold;
        }

        /* ================= FOOTER ================= */

        footer {
            margin-top: 40px;
            background: #111827;
            color: white;

            text-align: center;

            padding: 25px;
        }

    </style>
</head>

<body>

<!-- ================= HEADER ================= -->

<header>

    <div class="logo">
        Market<span>Hub</span>
    </div>

    <div class="header-right">

        <span>
            User: Rahul
        </span>

        <button
            class="cart-button"
            onclick="scrollToCart()"
        >
            🛒 Cart
        </button>

    </div>

</header>


<!-- ================= HERO ================= -->

<section class="hero">

    <h1>
        Everything You Need, In One Place
    </h1>

    <p>
        Explore products from different sellers.
    </p>

</section>


<!-- ================= SEARCH ================= -->

<div class="search-container">

    <input
        id="searchInput"
        type="text"
        placeholder="Search for products..."
    >

    <button onclick="searchProduct()">
        Search
    </button>

</div>

<div id="searchResult"></div>


<!-- ================= PRODUCTS ================= -->

<section class="section">

    <h2>
        Featured Products
    </h2>

    <div
        id="products"
        class="products"
    >

        Loading products...

    </div>

</section>


<!-- ================= CART ================= -->

<section
    id="cartSection"
    class="cart-section"
>

    <h2>
        🛒 Your Cart
    </h2>

    <div id="cart">

        Your cart is empty.

    </div>

    <button
        class="order-button"
        onclick="placeOrder()"
    >
        Place Order
    </button>

</section>


<div id="status"></div>


<!-- ================= FOOTER ================= -->

<footer>

    MarketHub — API Failure Pattern Miner

</footer>


<script>

    // ==========================================
    // USER
    // ==========================================

    const userId = 1;


    // ==========================================
    // LOAD PRODUCTS
    // ==========================================

    async function loadProducts() {

        try {

            const response =
                await fetch("/api/products");

            const data =
                await response.json();

            const container =
                document.getElementById("products");

            container.innerHTML = "";

            data.products.forEach(product => {

                let icon = "📦";

                if (
                    product.category ===
                    "Electronics"
                ) {
                    icon = "💻";
                }

                if (
                    product.category ===
                    "Fashion"
                ) {
                    icon = "🎒";
                }

                container.innerHTML += `

                    <div class="product-card">

                        <div class="product-image">
                            ${icon}
                        </div>

                        <h3>
                            ${product.name}
                        </h3>

                        <div class="category">
                            ${product.category}
                        </div>

                        <div class="price">
                            ₹${product.price}
                        </div>

                        <button
                            class="add-button"
                            onclick="addToCart(${product.id})"
                        >
                            Add to Cart
                        </button>

                    </div>

                `;

            });

        }

        catch (error) {

            console.error(error);

            document.getElementById(
                "products"
            ).innerHTML =
                "Unable to load products.";

        }

    }


    // ==========================================
    // ADD TO CART
    // ==========================================

    async function addToCart(productId) {

        try {

            const response =
                await fetch(
                    `/api/cart/${userId}`,
                    {

                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({

                            productId:
                                productId,

                            quantity:
                                1

                        })

                    }
                );

            const data =
                await response.json();

            if (data.success) {

                document.getElementById(
                    "status"
                ).innerText =
                    "✅ Product added to cart";

                loadCart();

            }

        }

        catch (error) {

            console.error(error);

        }

    }


    // ==========================================
    // LOAD CART
    // ==========================================

    async function loadCart() {

        try {

            const response =
                await fetch(
                    `/api/cart/${userId}`
                );

            const data =
                await response.json();

            const cartContainer =
                document.getElementById(
                    "cart"
                );

            if (
                !data.cart ||
                data.cart.length === 0
            ) {

                cartContainer.innerHTML =
                    "Your cart is empty.";

                return;

            }

            cartContainer.innerHTML = "";

            data.cart.forEach(item => {

                cartContainer.innerHTML += `

                    <div class="cart-item">

                        <span>
                            ${item.productName}
                        </span>

                        <span>
                            Quantity:
                            ${item.quantity}
                        </span>

                    </div>

                `;

            });

        }

        catch (error) {

            console.error(error);

        }

    }


    // ==========================================
    // PLACE ORDER
    // ==========================================

    async function placeOrder() {

        try {

            const response =
                await fetch(
                    `/api/orders/${userId}`,
                    {
                        method: "POST"
                    }
                );

            const data =
                await response.json();

            if (data.success) {

                document.getElementById(
                    "status"
                ).innerText =
                    `✅ Order #${data.order.orderId} placed successfully`;

                loadCart();

            }

            else {

                document.getElementById(
                    "status"
                ).innerText =
                    `⚠️ ${data.message}`;

            }

        }

        catch (error) {

            console.error(error);

        }

    }


    // ==========================================
    // SEARCH
    // ==========================================

    async function searchProduct() {

        const query =
            document.getElementById(
                "searchInput"
            ).value;

        if (!query) {

            return;

        }

        try {

            const response =
                await fetch(
                    `/api/search?q=${encodeURIComponent(query)}`
                );

            const data =
                await response.json();

            const result =
                document.getElementById(
                    "searchResult"
                );

            if (
                data.results &&
                data.results.length > 0
            ) {

                result.innerHTML =
                    `🔎 Found: ${data.results
                        .map(product =>
                            product.name
                        )
                        .join(", ")}`;

            }

            else {

                result.innerHTML =
                    "No matching products found.";

            }

        }

        catch (error) {

            console.error(error);

        }

    }


    // ==========================================
    // SCROLL TO CART
    // ==========================================

    function scrollToCart() {

        document.getElementById(
            "cartSection"
        ).scrollIntoView({
            behavior: "smooth"
        });

    }


    // ==========================================
    // INITIAL LOAD
    // ==========================================

    loadProducts();

    loadCart();

</script>

</body>
</html>
